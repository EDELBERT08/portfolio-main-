version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/node:20.10.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run Lint
          command: npm run lint
      - run:
          name: Run Tests
          command: npm test
      - run:
          name: Build Project
          command: npm run build

  sonar_scan:
    docker:
      - image: cimg/node:20.10.0
    steps:
      - checkout
      -nY run:
          name: Install dependencies
          command: npm install
      - run:
          name: SonarCloud Scan
          command: |
            npx sonar-scanner \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.organization=$SONAR_ORGANIZATION \
              -Dsonar.sources=src \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN

workflows:
  build_test_and_scan:
    jobs:
      - build_and_test
      - sonar_scan:
          requires:
            - build_and_test
